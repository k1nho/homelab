apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  annotations:
    # enable MagicDNS resolution to work within the cluster
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"

spec:
  defaultBackend:
    service:
      name: argocd-server
      port:
        number: 443
  ingressClassName: tailscale
  tls:
    - hosts:
        - argo
