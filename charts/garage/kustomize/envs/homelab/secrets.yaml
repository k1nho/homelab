apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: garage-rpc-secret-infisical
spec:
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: homelab-d-s7-g

        envSlug: "prod" # "dev", "staging", "prod"
        secretsPath: "/garage"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical-secrets-operator

  managedKubeSecretReferences:
    - secretName: garage-rpc-secret
      secretNamespace: garage
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          rpcSecret: "{{ .RPC_SECRET.Value }}"
