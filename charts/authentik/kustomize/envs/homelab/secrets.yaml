apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-db-user-credentials-infisical
spec:
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: homelab-d-s7-g

        envSlug: "prod" # "dev", "staging", "prod"
        secretsPath: "/authentik"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical-secrets-operator

  managedKubeSecretReferences:
    - secretName: authentik-db-user-credentials
      secretNamespace: auth
      creationPolicy: Owner
      secretType: kubernetes.io/basic-auth
      template:
        data:
          username: "{{ .AUTHENTIK_DB_USER.Value }}"
          password: "{{ .AUTHENTIK_DB_PASSWORD.Value }}"
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-backup-creds-infisical
spec:
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: homelab-d-s7-g

        envSlug: "prod" # "dev", "staging", "prod"
        secretsPath: "/garage/authentik"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical-secrets-operator

  managedKubeSecretReferences:
    - secretName: authentik-backup-creds
      secretNamespace: auth
      creationPolicy: Owner
      secretType: Opaque
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-secret-key-infisical
spec:
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: homelab-d-s7-g

        envSlug: "prod" # "dev", "staging", "prod"
        secretsPath: "/authentik"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical-secrets-operator

  managedKubeSecretReferences:
    - secretName: authentik-secret-key
      secretNamespace: auth
      creationPolicy: Owner
      secretType: Opaque
      template:
        data:
          AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY.Value }}"
